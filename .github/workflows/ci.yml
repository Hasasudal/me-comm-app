name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    # Deploys run one at a time so migrations and uploads never overlap.
    concurrency: ${{ github.event_name == 'push' && 'production' || github.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Informational: next 16.3.4 has a critical advisory in code vinext does not run (next/og, image optimizer),
      # so this reports without failing the job. Make it a hard gate once that advisory is resolved.
      - run: npm audit --omit=dev --audit-level=critical
        continue-on-error: true
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Integration tests (scripts/test-*.mjs) need a dev server and local secrets, so they stay manual.
      - name: Apply D1 migrations
        if: github.event_name == 'push'
        run: npx wrangler d1 migrations apply micom-lounge --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        if: github.event_name == 'push'
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
