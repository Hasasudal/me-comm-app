name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    # Deploys run one at a time so migrations and uploads never overlap.
    concurrency: ${{ github.event_name == 'push' && 'production' || github.ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build

      # Integration tests (scripts/test-*.mjs) need a dev server and local secrets, so they stay manual.
      - name: Apply D1 migrations
        if: github.event_name == 'push'
        run: npx wrangler d1 migrations apply micom-lounge --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        if: github.event_name == 'push'
        run: npx wrangler deploy --config dist/server/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
